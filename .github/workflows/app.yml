name: Desktop app

# 1. Tests the app on Linux (unit tests + end-to-end test against the mock Locals site).
# 2. Builds it on Windows, macOS and Linux. Every run attaches the installers to the run
#    (Actions tab -> the run -> Artifacts).
# 3. Publishing a release (two ways):
#    - Actions tab -> "Desktop app" -> Run workflow (branch: main) -> tick "Publish a release".
#      Publishes the version in app/package.json as release app-vX.Y.Z (and creates that tag).
#    - Or push a tag named app-vX.Y.Z.
#    Either way it uploads the installers and updates the "app-updates" release that
#    installed apps check for updates.

on:
  push:
    branches: [main]
    tags: ['app-v*']
  pull_request:
    paths: ['app/**', 'core/**', 'scripts/**', 'test/e2e/**', '.github/workflows/app.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release of the version in app/package.json (run on main)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install ffmpeg (used by the mock site and the downloads)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: Install
        working-directory: app
        run: npm ci
      - name: Download Electron (retried, as GitHub downloads sometimes time out)
        working-directory: app
        run: for i in 1 2 3 4 5 6; do node node_modules/electron/install.js && break; echo "retrying in 30 s"; sleep 30; done
      - name: Unit tests
        working-directory: app
        run: npm run sync && npm test
      - name: End-to-end test (mock Locals site, real yt-dlp)
        working-directory: app
        run: xvfb-run -a npm run test:e2e

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            command: npm run dist
            cache: ~/AppData/Local/electron/Cache
          - os: macos-latest
            name: mac
            command: npm run dist:mac
            cache: ~/Library/Caches/electron
          - os: ubuntu-latest
            name: linux
            command: npm run dist:linux
            cache: ~/.cache/electron
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no paid signing certificates (see app/README.md)
      # Mac: always apply the free "ad-hoc" signature (no certificate or secret involved),
      # also for pull-request builds; without it, Apple-silicon Macs call the app "damaged".
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.cache }}
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
          key: electron-${{ matrix.name }}-${{ hashFiles('app/package-lock.json') }}
      - name: Build
        working-directory: app
        shell: bash
        run: |
          npm ci
          # GitHub downloads sometimes time out; finished pieces are kept, so each try gets further.
          for i in 1 2 3 4 5 6; do node node_modules/electron/install.js && break; echo "retrying in 30 s"; sleep 30; done
          for i in 1 2 3 4 5 6 7 8; do ${{ matrix.command }} && break; echo "retrying in 30 s"; sleep 30; done
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: Keepsake-${{ matrix.name }}
          path: |
            app/dist/Keepsake-*
            app/dist/latest*.yml
          if-no-files-found: error

  release:
    # Runs after every build: gathers the files and rehearses the release, so a problem
    # shows up straight away rather than when publishing. Only publishes for app-v* tags,
    # or "Run workflow" on main with "Publish a release" ticked.
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/app-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the release files
        run: |
          v=$(node -p "require('./app/package.json').version")
          ls -la dist
          for f in "Keepsake-Setup-$v.exe" "Keepsake-$v-linux-x86_64.AppImage" \
                   "Keepsake-$v-mac-arm64.dmg" "Keepsake-$v-mac-x64.dmg" "Keepsake-$v-mac-arm64.zip" "Keepsake-$v-mac-x64.zip" \
                   latest.yml latest-mac.yml latest-linux.yml; do
            [ -s "dist/$f" ] || { echo "Missing: $f"; exit 1; }
          done
          # Rehearse the update feed on a copy
          cp -r dist /tmp/feed && node app/scripts/update-feed.js /tmp/feed "app-v$v"
          grep -q "releases/download/app-v$v/Keepsake-Setup-$v.exe" /tmp/feed/latest.yml
          echo "All release files present for $v; publishing: $PUBLISH"
      - name: Work out the release name
        if: env.PUBLISH == 'true'
        run: |
          v=$(node -p "require('./app/package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="app-v$v"
            if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already released: raise the version in app/package.json first."; exit 1; fi
          else
            TAG="$GITHUB_REF_NAME"
            [ "$TAG" = "app-v$v" ] || { echo "Tag $TAG does not match app version $v"; exit 1; }
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Publish the release
        if: env.PUBLISH == 'true'
        run: |
          gh release create "$TAG" dist/Keepsake-* --target "$GITHUB_SHA" \
            --prerelease --title "Keepsake desktop app ${TAG#app-v}" \
            --notes-file app/RELEASE-NOTES.md
      - name: Update the feed that installed apps check
        if: env.PUBLISH == 'true'
        run: |
          node app/scripts/update-feed.js dist "$TAG"
          gh release view app-updates >/dev/null 2>&1 || gh release create app-updates --prerelease \
            --title "App update feed (used by the desktop app – please keep)" \
            --notes "Installed copies of the Keepsake desktop app check these files for updates. Please don't delete this release. Downloads are on the app-v… releases."
          gh release upload app-updates dist/latest*.yml --clobber
