name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Extension copies of core/ are up to date
        run: node scripts/sync-core.js --check
      - name: Unit tests
        run: node test/run-tests.js
      - name: Firefox add-on lint
        run: npx --yes web-ext lint --source-dir extension --self-hosted
